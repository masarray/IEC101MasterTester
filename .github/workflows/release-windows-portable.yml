name: Release Windows Portable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_label:
        description: Optional package label for manual runs
        required: false
        default: manual

permissions:
  contents: write

jobs:
  release:
    name: Build portable release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build main application Release
        shell: pwsh
        run: msbuild IEC101MasterTester.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:UseSharedCompilation=false /m

      - name: Build slave simulator Release
        shell: pwsh
        run: msbuild IecSlaveSimulator\IecSlaveSimulator.csproj /restore /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:UseSharedCompilation=false /m

      - name: Create portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ github.event.inputs.version_label }}' }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = 'manual' }

          $outDir = 'artifacts'
          $packageDir = Join-Path $outDir 'IEC101MasterTester-windows-portable'
          $simDir = Join-Path $packageDir 'tools\IecSlaveSimulator'

          Remove-Item -Recurse -Force $outDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path $simDir | Out-Null

          if (!(Test-Path 'bin\Release\IEC101MasterTester.exe')) { throw 'Main application executable was not produced.' }
          if (!(Test-Path 'IecSlaveSimulator\bin\Release\net48\IecSlaveSimulator.exe')) { throw 'Slave simulator executable was not produced.' }

          Copy-Item -Path 'bin\Release\*' -Destination $packageDir -Recurse -Force
          Copy-Item -Path 'IecSlaveSimulator\bin\Release\net48\*' -Destination $simDir -Recurse -Force
          Remove-Item -Path (Join-Path $packageDir '*.pdb') -Force -ErrorAction SilentlyContinue
          Remove-Item -Path (Join-Path $simDir '*.pdb') -Force -ErrorAction SilentlyContinue
          Copy-Item -Path 'README.md','LICENSE','NOTICE','THIRD_PARTY_NOTICES.md' -Destination $packageDir -Force

          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir 'docs') | Out-Null
          Copy-Item -Path 'docs\QUICK_START.md','docs\FAQ.md','docs\TROUBLESHOOTING.md','docs\PROFESSIONAL_USE.md','docs\VALIDATION.md','docs\RELEASE_CHECKLIST.md' -Destination (Join-Path $packageDir 'docs') -Force

          $zipPath = Join-Path $outDir "IEC101MasterTester-$version-windows-portable.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force
          Get-FileHash $zipPath -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $zipPath -Leaf)" } | Set-Content (Join-Path $outDir "IEC101MasterTester-$version-windows-portable.sha256")

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: IEC101MasterTester-windows-portable
          path: artifacts/*

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
          generate_release_notes: true
