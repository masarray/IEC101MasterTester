name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WPF applications
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build main application Debug
        shell: pwsh
        run: msbuild IEC101MasterTester.csproj /t:Rebuild /p:Configuration=Debug /p:Platform=AnyCPU /p:UseSharedCompilation=false /m

      - name: Build main application Release
        shell: pwsh
        run: msbuild IEC101MasterTester.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:UseSharedCompilation=false /m

      - name: Build slave simulator Debug
        shell: pwsh
        run: msbuild IecSlaveSimulator\IecSlaveSimulator.csproj /restore /t:Rebuild /p:Configuration=Debug /p:Platform=AnyCPU /p:UseSharedCompilation=false /m

      - name: Build slave simulator Release
        shell: pwsh
        run: msbuild IecSlaveSimulator\IecSlaveSimulator.csproj /restore /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:UseSharedCompilation=false /m

      - name: Verify slave simulator Release executable
        shell: pwsh
        run: |
          $exe = 'IecSlaveSimulator\bin\Release\net48\IecSlaveSimulator.exe'
          if (-not (Test-Path $exe)) { throw "Missing build output: $exe" }
          Write-Host "Build output found: $exe"

      - name: Upload IEC101 Slave Simulator Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: IEC101SlaveSimulator-net48-windows
          path: |
            IecSlaveSimulator/bin/Release/net48/IecSlaveSimulator.exe
            IecSlaveSimulator/bin/Release/net48/*.dll
            IecSlaveSimulator/bin/Release/net48/*.config
          if-no-files-found: error
          retention-days: 30
